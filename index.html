<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S // 3D HAND CONTROL</title>
<style>
:root{--bg:#050d16;--line:#12384a;--cy:#00e5ff;--dim:#6fb3c4;--txt:#b9f4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 Consolas,"Cascadia Mono",monospace}
.app{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;height:100%;padding:14px}
#view{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:300px;
  background:radial-gradient(circle at 50% 40%,#16303f,#050b12 75%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#label{position:absolute;top:12px;left:14px;color:var(--cy);font-size:12px;pointer-events:none;z-index:2}
#hint{position:absolute;bottom:14px;left:14px;color:var(--dim);font-size:11px;pointer-events:none;z-index:2}
.btns{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:2}
button{font:inherit;color:var(--cy);background:#00e5ff14;border:1px solid var(--cy);border-radius:6px;padding:5px 11px;cursor:pointer}
button[hidden]{display:none}
button:hover{background:#00e5ff30}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.on{background:var(--cy);color:#001018}
#scanline{position:absolute;left:0;right:0;top:0;height:3px;background:var(--cy);box-shadow:0 0 24px 4px var(--cy);display:none;pointer-events:none;z-index:2}
#scanline.go{display:block;animation:sweep 1.6s ease-in-out 2 alternate}
@keyframes sweep{from{top:0}to{top:calc(100% - 3px)}}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.top{display:flex;justify-content:space-between;color:var(--cy);font-size:13px}
.reactor{position:relative;height:130px;flex:none}
.reactor i{position:absolute;left:50%;top:50%;border-radius:50%;translate:-50% -50%}
.r1{width:124px;height:124px;border:3px dashed var(--cy);animation:spin 12s linear infinite}
.r2{width:90px;height:90px;border:4px dotted #0091ea;animation:spin 7s linear infinite reverse}
.r3{width:52px;height:52px;background:#00e5ff22;border:2px solid var(--cy);box-shadow:0 0 28px var(--cy)}
.reactor b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:var(--cy)}
@keyframes spin{to{rotate:360deg}}
#out{flex:1;min-height:0;overflow:auto;white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:10px;background:#00000030;color:#80f0ff;font-size:13px}
.row{display:flex;gap:6px}
#in{flex:1;min-width:0;font:inherit;color:#fff;background:#ffffff0d;border:1px solid var(--cy);border-radius:6px;padding:7px 9px;caret-color:var(--cy)}
.send{background:var(--cy);color:#001018;font-weight:700}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:55% 45%}}
@media(prefers-reduced-motion:reduce){.reactor i,#scanline.go{animation:none}}
#tagLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#tagLines line{stroke:var(--cy);stroke-width:1.2;opacity:.85}
#tagLines circle{fill:var(--cy);stroke:#fff;stroke-width:1.5}
#tags{position:absolute;inset:0;pointer-events:none;z-index:1}
.tag{position:absolute;width:140px;padding:5px 8px;border:1px solid var(--cy);background:#04141ccc;border-radius:6px;cursor:pointer;pointer-events:auto;line-height:1.25}
.tag b{display:block;color:var(--cy);font-size:12px}
.tag span{color:var(--dim);font-size:11px}
.tag:hover,.tag.sel{background:#00e5ff30}
.tag.sel{box-shadow:0 0 12px var(--cy)}
.tag p{display:none;margin:7px 0 0;color:var(--txt);font-size:12.5px;line-height:1.5}
.tag.open{width:min(300px,44%);background:#04141cf0;box-shadow:0 0 16px #00e5ff55}
.tag.open p{display:block}
#tagLines line.act{stroke-width:2.4;opacity:1}
#view.drop{outline:2px dashed var(--cy);outline-offset:-6px}
#handBox,#faceBox{display:none;flex:none;width:240px;margin:0 auto;border:1px solid var(--cy);border-radius:8px;overflow:hidden;background:#000a}
#handBox .pv,#faceBox .pv{position:relative;width:240px;height:180px}
#handBox video,#faceBox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#handBox canvas,#faceBox canvas{position:absolute;inset:0;width:100%;height:100%}
#handPose,#facePose{padding:5px 8px;font-size:11px;line-height:1.35;color:var(--cy);min-height:32px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<input type="file" id="fileIn" accept=".glb" multiple hidden>
<div class="app">
  <div id="view">
    <div id="label">LOADING ENGINE MODEL...</div>
    <div id="scanline"></div>
    <svg id="tagLines"></svg><div id="tags"></div>
    <div id="hint">DRAG: ROTATE  |  WHEEL: ZOOM  |  DROP A .GLB TO LOAD IT  |  Upload models to ./models/</div>
    <div class="btns">
      <button id="bCar">CAR</button><button id="bArc">ARC</button><button id="bArc2">ARC 2</button>
      <button id="bSpin" class="on">SPIN</button><button id="bHolo">HOLO</button><button id="bLight" class="on">LIGHT</button><button id="bParts" class="on">PARTS</button><button id="bHand">HAND</button><button id="bListen">LISTEN</button><button id="bFace">FACE</button><button id="bCenter" hidden>CENTER</button>
      <button id="bScan">SCAN</button><button id="bReset">RESET</button><button id="bOpen">OPEN</button><button id="bLite">LITE</button><button id="bFull">FULL</button>
    </div>
  </div>
  <div class="side">
    <div class="top"><span>J.A.R.V.I.S // 3D ANALYSIS</span><span id="clock"></span></div>
    <div class="reactor"><i class="r1"></i><i class="r2"></i><i class="r3"></i><b>V</b></div>
    <div id="handBox"><div class="pv"><video id="handVid" muted playsinline></video><canvas id="handCv" width="320" height="240"></canvas></div><div id="handPose"></div></div>
    <div id="faceBox"><div class="pv"><video id="faceVid" muted playsinline></video><canvas id="faceCv" width="320" height="240"></canvas></div><div id="facePose"></div></div>
    <div id="out" aria-live="polite"></div>
    <div class="row">
      <input id="in" placeholder="Type a command (try: help)" autocomplete="off">
      <button id="mic">MIC</button><button class="send" id="send">SEND</button>
    </div>
  </div>
</div>
<script>
setTimeout(function () {
  if (!window.__jarvis) {
    document.getElementById('out').textContent += 'ERROR > The 3D library did not load from cdn.jsdelivr.net. Check your internet connection, VPN or ad-blocker, then press F5.\n';
    document.getElementById('label').textContent = '3D LIBRARY FAILED TO LOAD';
  }
}, 10000);
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

window.__jarvis = true;
const AUTO_LITE = false;   // false = never make fast copies by itself (press LITE to do it yourself)
const PRELOAD = false;   // false = load a model only when you open it (lighter on your PC)
const $ = id => document.getElementById(id), out = $('out');
const log = t => { out.textContent += t + '\n'; out.scrollTop = out.scrollHeight; };
const say = (t, speak = true) => { log('JARVIS > ' + t); if (speak && 'speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(t)); };
addEventListener('error', e => log('ERROR > ' + e.message));
addEventListener('unhandledrejection', e => log('ERROR > ' + ((e.reason && e.reason.message) || e.reason)));
const fmt = n => Math.round(n).toLocaleString();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const tick = w => log('TIME > ' + w + ': ' + (performance.now() / 1000).toFixed(1) + 's after the page opened');
tick('page scripts loaded');

// ---------- scene ----------
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(45, 1, 0.05, 50);
const HOME = new THREE.Vector3(2.6, 1.3, 3.4);
cam.position.copy(HOME);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 4, 2); scene.add(sun);
const ctl = new OrbitControls(cam, renderer.domElement);
Object.assign(ctl, { enableDamping: true, autoRotate: true, autoRotateSpeed: 1.2, minDistance: 1.2, maxDistance: 9 });
new ResizeObserver(() => {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
}).observe(view);
// ---------- arc reactor light ----------
let lightOn = true;
const arcFx = new THREE.Group(); arcFx.visible = false; scene.add(arcFx);
const arcLights = [];
for (const z of [1.4, -1.4]) {
  const l = new THREE.PointLight(0x00e5ff, 0, 8, 1.6); l.position.set(0, 0, z); arcFx.add(l); arcLights.push(l);
}
const arcCore = new THREE.PointLight(0x66f3ff, 0, 5, 2); arcCore.position.set(0, 0, 0); arcFx.add(arcCore); arcLights.push(arcCore);
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'), g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(220,255,255,1)'); g.addColorStop(0.25, 'rgba(0,229,255,0.65)');
  g.addColorStop(0.6, 'rgba(0,150,255,0.18)'); g.addColorStop(1, 'rgba(0,100,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const arcGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false }));
arcGlow.scale.setScalar(2.6); arcFx.add(arcGlow);
function applyLight() {
  arcFx.visible = lightOn && isArc(active) && M[active].state === 'ready';
  $('bLight').classList.toggle('on', lightOn);
}

renderer.setAnimationLoop(() => {
  ctl.update();
  if (arcFx.visible) {
    const t = performance.now() / 1000, p = 0.5 + 0.5 * Math.sin(t * 2.2);
    arcLights[0].intensity = arcLights[1].intensity = 25 + 20 * p;
    arcCore.intensity = 10 + 10 * p;
    arcGlow.material.opacity = 0.65 + 0.3 * p;
    arcGlow.scale.setScalar(2.3 + 0.5 * p);
  }
  updateTags();
  renderer.render(scene, cam);
});

// ---------- models ----------
const M = { engine: { file: 'Car_Engine.glb', title: 'ENGINE' }, car: { file: 'porsche_gt3.glb', title: 'PORSCHE GT3' }, arc: { file: 'arc_reactor.glb', title: 'ARC REACTOR' }, arc2: { file: 'arc_reactor_2.glb', title: 'ARC REACTOR 2' } };
// GitHub Pages static hosting: look for models in ./models/ instead of a local PowerShell API.
async function getModelInfo() {
  const info = {};
  for (const item of Object.values(M)) {
    try {
      const r = await fetch('./models/' + item.file, { method: 'HEAD', cache: 'no-store' });
      if (r.ok) info[item.file] = item.file;
    } catch (_) {}
  }
  return info;
}
const ACTUAL = {};
const isArc = k => k === 'arc' || k === 'arc2';
let active = 'engine', holo = false, scanning = false;
const holoMat = new THREE.MeshStandardMaterial({ color: 0x00b8d4, emissive: 0x00303c, roughness: 0.55, metalness: 0.1 });

// Loader that understands Draco and Meshopt compressed models
const gltfLoader = new GLTFLoader()
  .setDRACOLoader(new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/'))
  .setMeshoptDecoder(MeshoptDecoder);

async function load(key, file) {
  const m = M[key]; m.state = 'loading';
  let blobUrl = null;
  const tL0 = performance.now(); let tDl = 0, totalMB = 0;
  try {
    let url;
    if (file) { blobUrl = URL.createObjectURL(file); url = blobUrl; ACTUAL[m.file] = file.name; }
    else {
      const info = await getModelInfo();
      if (!info[m.file]) throw new Error('HTTP 404');
      ACTUAL[m.file] = info[m.file];
      url = './models/' + m.file;
    }
    // the loader streams the file itself (no extra copy of a huge file in memory)
    const g = await gltfLoader.loadAsync(url, ev => {
      if (ev.total && ev.loaded >= ev.total && !tDl) { tDl = performance.now(); totalMB = ev.total / 1048576; }
      if (active !== key) return;
      $('label').textContent = ev.total && ev.loaded >= ev.total ? `PROCESSING ${m.title} MODEL...`
        : `LOADING ${m.title} MODEL ` + (ev.total ? Math.round(ev.loaded / ev.total * 100) + '%' : (ev.loaded / 1048576).toFixed(0) + ' MB');
    });
    const root = g.scene, box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
    root.position.sub(c);
    const wrap = new THREE.Group(); wrap.add(root);
    wrap.scale.setScalar(2 / Math.max(size.x, size.y, size.z));
    let tris = 0, verts = 0;
    root.traverse(o => { if (o.isMesh) {
      o.userData.mat = o.material;
      verts += o.geometry.attributes.position.count;
      tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
    } });
    if (tris <= 600000) root.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(mt => { mt.side = THREE.DoubleSide; }); });
    else log(`NOTE > ${m.title} is a heavy model (${fmt(tris)} triangles). Using light rendering so it stays smooth.`);
    wrap.visible = false; scene.add(wrap);
    Object.assign(m, { wrap, size, tris, verts, state: 'ready' });
    log(`TIME > ${m.title}: ${totalMB ? totalMB.toFixed(0) + ' MB, ' : ''}download ${tDl ? ((tDl - tL0) / 1000).toFixed(1) : '?'}s, processing ${((performance.now() - (tDl || tL0)) / 1000).toFixed(1)}s, ${fmt(tris)} triangles`);
    return true;
  } catch (e) {
    m.state = String(e.message) === 'HTTP 404' ? 'missing' : 'failed';
    if (m.state === 'failed') log(`ERROR > ${m.file}: ${e.message}`);
    return false;
  } finally { if (blobUrl) URL.revokeObjectURL(blobUrl); }
}

function show(key) {
  const m = M[key];
  if (m.state === 'missing') return say(`${m.title} is not available: no ${m.file} was found next to the script.`);
  if (m.state === 'failed') return say(`The ${m.title} model failed to load. See the error above.`);
  active = key; tagSel = -1; tagNext = 0;
  if (!m.state) {
    $('label').textContent = `LOADING ${m.title} MODEL...`; say(`Loading the ${m.title} model.`);
    load(key).then(ok => {
      if (ok) { if (active === key) show(key); }
      else say(m.state === 'missing' ? `${m.title} is not available: no ${m.file} was found.` : `I couldn't load the ${m.title} model. See the error above.`);
    });
    return;
  }
  if (m.state !== 'ready') { $('label').textContent = `LOADING ${m.title} MODEL...`; return say(`The ${m.title} model is still loading.`); }
  for (const k in M) if (M[k].wrap) M[k].wrap.visible = k === key;
  if (!PRELOAD) for (const k in M) if (k !== key && M[k].state === 'ready' && !M[k].fromFile && M[k].tris > 400000) freeModel(k);   // keep memory low
  applyHolo(); applyLight(); applyPerf(m);
  if (isArc(key) && !m.tags && !m.tagsBuilding) {
    m.tagsBuilding = true;
    setTimeout(() => { try { buildTags(m); } catch (e) { log('ERROR > part labels: ' + e.message); } }, 80);
  }
  if (AUTO_LITE && m.tris > LITE_TRIS && !m.fromFile && !m.liteTried && !isLiteFile(key)) { m.liteTried = true; setTimeout(() => makeLite(key, false), 2500); }
  $('label').textContent = `${m.title}  //  ${fmt(m.tris)} POLYGONS`;
  $('bCar').classList.toggle('on', key === 'car'); $('bArc').classList.toggle('on', key === 'arc'); $('bArc2').classList.toggle('on', key === 'arc2');
}
function applyPerf(m) {
  const ratio = m.tris > 600000 ? 1 : Math.min(devicePixelRatio, 1.5);
  if (renderer.getPixelRatio() !== ratio) { renderer.setPixelRatio(ratio); renderer.setSize(view.clientWidth, view.clientHeight, false); }
}
function applyHolo() {
  const w = M[active].wrap; if (!w) return;
  w.traverse(o => { if (o.isMesh) o.material = holo ? holoMat : o.userData.mat; });
  $('bHolo').classList.toggle('on', holo);
}

// ---------- scan ----------
const REPORT = {
  engine: [
    '[2] WHAT IT IS', '  A car engine is an internal combustion engine. It burns fuel and air in cylinders and turns that energy into rotation.', '',
    '[3] MAIN PARTS', '  Engine block - holds the cylinders', '  Pistons + connecting rods - burn pressure becomes motion',
    '  Crankshaft - turns up/down motion into rotation', '  Cylinder head - valves, spark plugs or injectors',
    '  Camshaft + valves - let air in and exhaust out', '  Timing belt/chain - keeps crank and cam in sync',
    '  Intake + exhaust manifolds - air in, gases out', '  Oil pan + pump, water pump + radiator - lubrication and cooling',
    '  Flywheel, alternator, starter, optional turbo', '',
    '[4] FOUR-STROKE CYCLE', '  Intake > Compression > Power > Exhaust', '',
    '[5] TYPICAL FIGURES (general)', '  Idle 600-900 rpm | petrol max 6000-7000 rpm', '  Compression: petrol 9-12:1, diesel 14-22:1', '  Coolant about 90-105 C | efficiency 25-40 %', '',
    '[6] BASIC CARE (follow your manual)', '  Oil + filter 5,000-10,000 km | spark plugs 40,000-100,000 km', '  Timing belt about 100,000 km | coolant every 2-5 years'],
  arc: [
    '[2] WHAT IT IS', '  The arc reactor is a fictional compact power source from the Iron Man stories. No such device exists in real life.', '',
    '[3] IN THE STORIES', '  A tiny fusion-style reactor in a ring housing', '  Powers the suit and, in the story, Tony Stark himself',
    '  Typical design: a ring of coils around a glowing core', '',
    '[4] REAL-WORLD COUNTERPART', '  Fusion power: tokamaks and stellarators hold plasma hotter than 100 million C with magnetic fields',
    '  ITER (under construction) targets 500 MW out for 50 MW of heating power', '  In Dec 2022 the US National Ignition Facility got more fusion energy out than laser energy in',
    '  Compact, pocket-sized fusion does not exist yet', '',
    '[5] NOTE', '  The file is one unlabeled mesh. The PARTS labels are placed from the typical arc reactor layout, not read from the file.'],
  car: [
    '[2] WHAT IT IS', '  The Porsche 911 GT3 is the track-focused 911, road legal but built for circuits.', '',
    '[3] KEY FEATURES', '  Naturally aspirated flat-six behind the rear axle', '  Rear-wheel drive, PDK dual-clutch (manual on recent models)',
    '  Big rear wing, front splitter, underbody aero', '  Motorsport suspension and rear-axle steering', '  Large brakes, ceramic (PCCB) optional', '',
    '[4] TYPICAL FIGURES (recent 992 GT3, approx.)', '  4.0 L flat-six, about 9,000 rpm redline', '  About 510 PS (375 kW), 470 Nm',
    '  0-100 km/h about 3.4 s | top speed about 318 km/h', '  Weight about 1,400-1,500 kg | length about 4.57 m', '  Older generations differ.', '',
    '[5] BASIC CARE (follow your manual)', '  Service about yearly or 20,000 km, sooner after track use', '  Brake fluid about every 2 years']
};
REPORT.arc2 = REPORT.arc;
function scan() {
  const m = M[active];
  if (m.state !== 'ready') return say('No model is loaded.');
  if (scanning) return;
  scanning = true;
  say(`Scanning the ${m.title.toLowerCase()}...`);
  const sl = $('scanline'); sl.classList.remove('go'); void sl.offsetWidth; sl.classList.add('go');
  setTimeout(() => {
    sl.classList.remove('go');
    const s = m.size, k = Math.max(s.x, s.y, s.z);
    const L = [`=== ${m.title} SCAN REPORT ===`, '', '[1] MODEL DATA (from your file)', `  File     : ${ACTUAL[m.file] || m.file}`,
      `  Polygons : ${fmt(m.tris)} triangles`, `  Vertices : ${fmt(m.verts)}`,
      `  Size ratio (x:y:z): ${(s.x / k).toFixed(2)} : ${(s.y / k).toFixed(2)} : ${(s.z / k).toFixed(2)}`,
      '  The file is ONE unlabeled mesh, so exact make, generation and condition cannot be read from it.', '',
      ...REPORT[active], '', '=== END OF REPORT ==='];
    let i = 0;
    const t = setInterval(() => {
      if (i < L.length) return log(L[i++]);
      clearInterval(t); scanning = false;
      say({ car: `Scan complete. Going by the file name, this is a Porsche 911 GT3 model with ${fmt(m.tris)} polygons.`,
            arc: `Scan complete. This is an arc reactor model with ${fmt(m.tris)} polygons. It is a fictional power source from the Iron Man stories.`,
            engine: `Scan complete. This is a car engine model with ${fmt(m.tris)} polygons.` }[active === 'arc2' ? 'arc' : active] + ' The full report is in the console.');
    }, 70);
  }, 3300);
}

// ---------- commands ----------
// "bring up everything on arc reactor 2", "show me the engine", "scan the car" ... -> which model, and whether to show everything
function naturalModel(c) {
  const all = /(everything|all (?:the )?(?:info|information|details|data)|all about|full (?:report|info|scan|briefing)|brief me|analy[sz]e|\bscan\b)/.test(c);
  const verb = /(bring up|pull up|show me|show|display|load|open|give me|tell me|what is|what's|information|info|details|brief me|analy[sz]e|\bscan\b)/.test(c);
  if (!all && !verb) return null;
  let key = null;
  if (/\barc\b|\bark\b|reactor/.test(c)) key = /(?:\barc\b|\bark\b|reactor)\s*(?:2|two|to|too)\b|second|number (?:2|two)/.test(c) ? 'arc2' : 'arc';
  else if (/engine/.test(c)) key = 'engine';
  else if (/porsche|gt3|\bcar\b/.test(c)) key = 'car';
  return key ? { key, all } : null;
}
async function bringUp(key, everything) {
  say(everything ? `Bringing up everything on ${M[key].title}.` : `Bringing up ${M[key].title}.`);
  show(key);
  if (!everything) return;

  let info = {};
  try { info = await getModelInfo(); } catch (e) {}
  const btn = { car: 'bCar', arc: 'bArc', arc2: 'bArc2' };
  for (const k of ['car', 'arc', 'arc2']) {
    if (!info[M[k].file]) { M[k].state = 'missing'; $(btn[k]).style.display = 'none'; }   // no file: no button
  }
  await enginePre;
  if (!PRELOAD) return;
  for (const k of ['car', 'arc', 'arc2']) {
    if (M[k].state === 'missing') continue;
    await sleep(300);
    const ok = await load(k);
    if (ok && active === k) show(k);
  }
  const ready = Object.keys(M).filter(k => M[k].state === 'ready').map(k => M[k].title);
  log('READY > ' + ready.join(', '));
})();
startApp();
</script>
</body>
